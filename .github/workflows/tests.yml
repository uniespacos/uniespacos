name: Tests

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  # Execução diária em dias úteis (06:00 em Salvador / 09:00 UTC). Detecta "bomba-relógio" de data
  # no dia em que explode, não no dia do release. Workflows agendados só rodam a partir do arquivo
  # presente na branch padrão do repositório (main); por isso o checkout abaixo força `develop`.
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Necessário para o paths-filter listar os arquivos da PR via API (sem precisar de fetch-depth: 0).
  pull-requests: read

env:
  # Em `schedule` o GITHUB_REF é a branch padrão; testamos sempre o develop.
  CHECKOUT_REF: ${{ github.event_name == 'schedule' && 'develop' || '' }}

jobs:
  # Decide se a PR mexe em código. A PR do release-please só toca CHANGELOG.md e o manifest de
  # versão: o código é byte a byte o mesmo que acabou de passar na PR da feature, então rodar a
  # suíte inteira de novo é puro desperdício. Fora de pull_request (schedule/dispatch) roda sempre.
  changes:
    name: 🔎 Detectar mudanças
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code }}
    steps:
      - name: Filtrar arquivos alterados
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          # `every`: um arquivo só conta como "código" se casar com TODOS os padrões abaixo,
          # ou seja, se não for nenhuma das exclusões.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!.release-please-manifest*.json'
              - '!docs/**'

  test-backend:
    name: 🐘 Backend Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: uniespacos_test
          POSTGRES_USER: uniespacos
          POSTGRES_PASSWORD: uniespacossecretkey
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup Environment
        run: |
          cp .env.testing .env
          sed -i 's/DB_HOST=postgres/DB_HOST=127.0.0.1/g' .env
          sed -i 's/DB_DATABASE=uniespacos/DB_DATABASE=uniespacos_test/g' .env

      - name: Setup PHP + vendor
        uses: ./.github/actions/setup-php-deps
        with:
          extensions: mbstring, dom, fileinfo, pdo_pgsql, pgsql, bcmath, intl, zip, gd, redis

      - name: Generate App Key
        run: php artisan key:generate

      - name: Run Migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: uniespacos_test
          DB_USERNAME: uniespacos
          DB_PASSWORD: uniespacossecretkey
        run: php artisan migrate --seed --force

      - name: Run Tests
        env:
          APP_ENV: testing
          BROADCAST_CONNECTION: 'null'
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: uniespacos_test
          DB_USERNAME: uniespacos
          DB_PASSWORD: uniespacossecretkey
        run: php artisan test

  test-frontend:
    name: ⚛️ Frontend Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Setup Node + node_modules
        uses: ./.github/actions/setup-node-deps

      - name: Run Tests
        run: npm test -- --ci --maxWorkers=2

  # Job agregador: é ele que se marca como check obrigatório na proteção de branch ("✅ Tests"),
  # independente de como os jobs de teste são divididos. `if: always()` é essencial: sem ele,
  # uma falha em test-backend/test-frontend deixaria este job como "skipped", e o GitHub trata
  # check obrigatório pulado como aprovado.
  # Quando `changes` conclui que a PR não mexe em código (ex.: PR do release-please), os jobs de
  # teste ficam "skipped" de propósito e o agregador aprova — mas só se o próprio `changes` passou.
  tests:
    name: ✅ Tests
    if: always()
    needs: [changes, test-backend, test-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verificar resultado dos jobs de teste
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          HAS_CODE: ${{ needs.changes.outputs.code }}
          RESULTADOS: ${{ needs.test-backend.result }} ${{ needs.test-frontend.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Detecção de mudanças falhou ($CHANGES_RESULT)"
            exit 1
          fi
          if [ "$HAS_CODE" != "true" ]; then
            echo "Nenhuma mudança de código (só docs/changelog/manifest) — testes dispensados."
            exit 0
          fi
          echo "Resultados dos jobs de teste: $RESULTADOS"
          for resultado in $RESULTADOS; do
            if [ "$resultado" != "success" ]; then
              echo "::error::Job de teste não concluiu com sucesso (resultados: $RESULTADOS)"
              exit 1
            fi
          done
