name: Lint & Static Analysis

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Necessário para o paths-filter listar os arquivos da PR via API.
  pull-requests: read

jobs:
  # Mesma lógica do tests.yml: PR que só mexe em docs/changelog/manifest (ex.: release-please)
  # não precisa de lint nem PHPStan.
  changes:
    name: 🔎 Detectar mudanças
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Filtrar arquivos alterados
        id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!.release-please-manifest*.json'
              - '!docs/**'

  lint-backend:
    name: 🐘 PHP Lint (Pint)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP + vendor
        uses: ./.github/actions/setup-php-deps
        with:
          composer-flags: --no-scripts

      - name: Run Pint (PHP Code Style)
        run: vendor/bin/pint --test

  lint-frontend:
    name: ⚛️ Frontend Lint & Types
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node + node_modules
        uses: ./.github/actions/setup-node-deps

      - name: Run TypeScript Check
        run: npx tsc --noEmit

      - name: Run ESLint (Frontend Linting)
        run: npm run lint:check

  # Relatório informativo do débito de lint. Roda o ESLint inteiro de novo (~18s), por isso fica
  # em job paralelo e fora do agregador: não segura o check obrigatório nem pode reprová-lo.
  lint-debt:
    name: 📊 Débito de Lint (informativo)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node + node_modules
        uses: ./.github/actions/setup-node-deps

      - name: Reportar Débito de Lint (Supressões)
        run: |
          echo "## 📊 Débito de Lint (supressões ativas)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx eslint resources/js --suppressions-location eslint-suppressions.empty.json 2>&1 | tail -3 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  static-analysis:
    name: 🔬 PHP Static Analysis (PHPStan)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP + vendor
        uses: ./.github/actions/setup-php-deps
        with:
          composer-flags: --no-scripts

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      - name: Report PHPStan Results
        if: always()
        run: |
          echo "## 🔬 PHP Static Analysis (PHPStan)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          vendor/bin/phpstan analyse --no-progress --memory-limit=2G 2>&1 | tail -20 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Job agregador: mantém o nome do check obrigatório na proteção da branch develop
  # ("🔍 Lint & Static Analysis"), independente de como os jobs de lint são divididos.
  # `if: always()` é essencial: sem ele, uma falha em lint-backend/lint-frontend deixaria
  # este job como "skipped", e o GitHub trata check obrigatório pulado como aprovado.
  # Quando `changes` conclui que não há código na PR, os jobs de lint ficam "skipped" de propósito
  # e o agregador aprova — mas só se o próprio `changes` passou.
  lint:
    name: 🔍 Lint & Static Analysis
    if: always()
    needs: [changes, lint-backend, lint-frontend, static-analysis]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verificar resultado dos jobs de lint
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          HAS_CODE: ${{ needs.changes.outputs.code }}
          RESULTADOS: ${{ needs.lint-backend.result }} ${{ needs.lint-frontend.result }} ${{ needs.static-analysis.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Detecção de mudanças falhou ($CHANGES_RESULT)"
            exit 1
          fi
          if [ "$HAS_CODE" != "true" ]; then
            echo "Nenhuma mudança de código (só docs/changelog/manifest) — lint dispensado."
            exit 0
          fi
          echo "Resultados dos jobs de lint: $RESULTADOS"
          for resultado in $RESULTADOS; do
            if [ "$resultado" != "success" ]; then
              echo "::error::Job de lint não concluiu com sucesso (resultados: $RESULTADOS)"
              exit 1
            fi
          done
