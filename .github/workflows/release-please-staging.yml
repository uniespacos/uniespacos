name: Release Please (Staging)

on:
    push:
        branches:
            - develop

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        steps:
            - uses: googleapis/release-please-action@v5
              with:
                  token: ${{ secrets.PAT_RELEASE_PLEASE_STAGING }}
                  config-file: release-please-config-staging.json
                  manifest-file: .release-please-manifest-staging.json
                  target-branch: develop
