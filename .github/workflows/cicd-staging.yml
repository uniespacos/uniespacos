name: CI/CD - Staging

on:
  push:
    tags:
      - "v*-*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test-backend:
    name: 🐘 Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: uniespacos_test
          POSTGRES_USER: uniespacos
          POSTGRES_PASSWORD: uniespacossecretkey
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_pgsql, pgsql, bcmath, intl, zip, gd, redis
          coverage: none
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Setup Environment
        run: |
          cp .env.testing .env
          sed -i 's/DB_HOST=postgres/DB_HOST=127.0.0.1/g' .env
          sed -i 's/DB_DATABASE=uniespacos/DB_DATABASE=uniespacos_test/g' .env
          composer install --no-interaction --no-progress --prefer-dist
          php artisan key:generate

      - name: Run Migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: uniespacos_test
          DB_USERNAME: uniespacos
          DB_PASSWORD: uniespacossecretkey
        run: php artisan migrate --seed --force

      - name: Run Tests
        env:
          APP_ENV: testing
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: uniespacos_test
          DB_USERNAME: uniespacos
          DB_PASSWORD: uniespacossecretkey
        run: php artisan test

  test-frontend:
    name: ⚛️ Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Run Tests
        run: npm test -- --ci --maxWorkers=2

  build-and-push:
    name: 🐳 Build & Push to GHCR
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker meta for app image
        id: meta_app
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/app
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=staging,enable=${{ github.ref_type == 'tag' }}

      - name: Generate Docker meta for web image
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=staging,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push PHP App Image
        env:
          APP_NAME: ${{ secrets.APP_NAME }}
          APP_ENV: staging
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/production/php-fpm/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta_app.outputs.tags }}
          labels: ${{ steps.meta_app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_REVERB_APP_KEY=${{ secrets.VITE_REVERB_APP_KEY_STAGING }}
            VITE_REVERB_HOST=${{ secrets.VITE_REVERB_HOST_STAGING }}
            VITE_REVERB_PORT=${{ secrets.VITE_REVERB_PORT_STAGING }}
            VITE_REVERB_SCHEME=${{ secrets.VITE_REVERB_SCHEME_STAGING }}

      - name: Build and push Caddy Web Image
        env:
          APP_NAME: ${{ secrets.APP_NAME }}
          APP_ENV: staging
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/production/caddy/Dockerfile
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_IMAGE=ghcr.io/${{ github.repository }}/app:${{ steps.meta_app.outputs.version }}

  deploy_staging:
    name: 🚀 Deploy to Staging
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: staging
    env:
      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID_STAGING }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET_STAGING }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_STAGING }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "Host ${{ secrets.SSH_HOST_STAGING }}
            User ${{ secrets.SSH_USER_STAGING }}
            IdentityFile ~/.ssh/id_ed25519
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy to Staging via SSH
        run: |
          STAGING_PATH="${{ secrets.PATH_TO_APP_FOLDER_STAGING }}"
          RAW_TAG=${{ github.ref_type == 'tag' && github.ref_name || 'staging' }}
          IMAGE_TAG=$(echo "$RAW_TAG" | sed 's/^v//')

          scp ./compose.prod.yml ${{ secrets.SSH_USER_STAGING }}@${{ secrets.SSH_HOST_STAGING }}:${STAGING_PATH}/compose.prod.yml
          scp ./docker/production/scripts/deploy.sh ${{ secrets.SSH_USER_STAGING }}@${{ secrets.SSH_HOST_STAGING }}:${STAGING_PATH}/deploy.staging.sh
          scp ./docker/production/scripts/rollback.sh ${{ secrets.SSH_USER_STAGING }}@${{ secrets.SSH_HOST_STAGING }}:${STAGING_PATH}/rollback.staging.sh
          scp ./docker/production/scripts/provision-staging.sh ${{ secrets.SSH_USER_STAGING }}@${{ secrets.SSH_HOST_STAGING }}:${STAGING_PATH}/provision-staging.sh

          ssh ${{ secrets.SSH_USER_STAGING }}@${{ secrets.SSH_HOST_STAGING }} "
            mkdir -p ${STAGING_PATH}/docker/production/caddy
            cat > ${STAGING_PATH}/docker/production/caddy/Caddyfile
          " < ./docker/production/caddy/Caddyfile.staging

          ssh ${{ secrets.SSH_USER_STAGING }}@${{ secrets.SSH_HOST_STAGING }} "
            set -e
            cd ${STAGING_PATH}
            chmod +x deploy.staging.sh rollback.staging.sh provision-staging.sh
            ./provision-staging.sh ${STAGING_PATH}
            echo '${{ secrets.PAT_STAGING }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            set -a
            source .env
            set +a
            ./deploy.staging.sh ${IMAGE_TAG}
          "
