services:
  web:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/development/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./:/var/www
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
  app:
    build:
      context: .
      dockerfile: ./docker/development/php-fpm/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
        # 'coverage' e 'profile' instrumentam/perfilam TODO request e custavam
        # 5-6x no tempo de resposta (ex.: /espacos 1.9s -> 0.3s ao removê-los).
        # 'debug' continua aqui, então breakpoints seguem funcionando normalmente.
        # Para rodar cobertura de testes: XDEBUG_MODE=coverage docker compose ...
        XDEBUG_MODE: ${XDEBUG_MODE:-develop,debug}
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: ${XDEBUG_LOG:-/dev/stdout}
        XDEBUG_LOG_LEVEL: ${XDEBUG_LOG_LEVEL:-0}
    env_file:
      - .env
    environment:
      # O Xdebug 3 lê XDEBUG_MODE do ambiente e ele tem precedência sobre o ini
      # gravado no build — assim dá para ajustar o modo com um restart do
      # container, sem precisar reconstruir a imagem.
      XDEBUG_MODE: ${XDEBUG_MODE:-develop,debug}
    volumes:
      - ./:/var/www
    depends_on:
      postgres:
        condition: service_healthy
  queue-worker:
    build:
      context: .
      dockerfile: ./docker/development/php-fpm/Dockerfile
    entrypoint: [ "sh", "-c", "php artisan queue:work --verbose --tries=3 --timeout=90" ]
    restart: unless-stopped
    volumes:
      - ./:/var/www/
    env_file:
      - .env
    depends_on:
      reverb:
        condition: service_started

  workspace:
    build:
      context: .
      dockerfile: ./docker/development/workspace/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
        # 'coverage' e 'profile' instrumentam/perfilam TODO request e custavam
        # 5-6x no tempo de resposta (ex.: /espacos 1.9s -> 0.3s ao removê-los).
        # 'debug' continua aqui, então breakpoints seguem funcionando normalmente.
        # Para rodar cobertura de testes: XDEBUG_MODE=coverage docker compose ...
        XDEBUG_MODE: ${XDEBUG_MODE:-develop,debug}
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: ${XDEBUG_LOG:-/dev/stdout}
        XDEBUG_LOG_LEVEL: ${XDEBUG_LOG_LEVEL:-0}
    ports:
      - '5173:5173'
    tty: true
    stdin_open: true
    volumes:
      - ./:/var/www
    env_file:
      - .env
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-develop,debug}
  reverb:
    build:
      context: .
      dockerfile: ./docker/development/php-fpm/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./:/var/www
    entrypoint: [ "sh", "-c", "php artisan reverb:start --host=0.0.0.0 --port=9000 --hostname='reverb' --debug" ]
    env_file:
      - .env
    depends_on:
      app:
        condition: service_started
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data-development:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}" ]
      interval: 10s
      timeout: 5s
      retries: 5
  adminer:
    image: adminer:5
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    volumes:
      - ./docker/development/mailpit/data:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_DATABASE: /data/mailpit.db

volumes:
  postgres-data-development:
  caddy_data:
  caddy_config:
